plugins { id 'com.android.application' }
android {
 namespace 'pt.mesasemana.app'
 compileSdk 35
 defaultConfig { applicationId 'pt.mesasemana.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 signingConfigs {
  release {
   if (System.getenv('MESA_KEYSTORE')) {
    storeFile file(System.getenv('MESA_KEYSTORE'))
    storePassword System.getenv('MESA_STORE_PASSWORD')
    keyAlias System.getenv('MESA_KEY_ALIAS')
    keyPassword System.getenv('MESA_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { if (System.getenv('MESA_KEYSTORE')) signingConfig signingConfigs.release } }
}
dependencies {
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
